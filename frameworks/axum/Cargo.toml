[package]
name = "axum-server"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[[bin]]
name = "axum-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
socket2 = { version = "0.6", features = ["all"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
